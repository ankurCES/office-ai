<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="96" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Quill feather pen — elegant sweep -->
  <g transform="translate(256, 256) rotate(-30)" filter="url(#glow)">
    <!-- Feather body -->
    <path d="M -20,140 C -10,80 -40,-20 -60,-100 C -50,-120 -30,-140 0,-160
             C 30,-140 50,-120 60,-100 C 40,-20 10,80 20,140 Z"
          fill="url(#quillGrad)" opacity="0.95"/>

    <!-- Feather center vane (rachis) -->
    <line x1="0" y1="-155" x2="0" y2="140" stroke="#e2e8f0" stroke-width="2.5" opacity="0.6"/>

    <!-- Barb lines left -->
    <g stroke="#c4b5fd" stroke-width="1.2" opacity="0.35">
      <line x1="0" y1="-120" x2="-35" y2="-100"/>
      <line x1="0" y1="-90" x2="-45" y2="-65"/>
      <line x1="0" y1="-60" x2="-50" y2="-30"/>
      <line x1="0" y1="-30" x2="-48" y2="5"/>
      <line x1="0" y1="0" x2="-42" y2="35"/>
      <line x1="0" y1="30" x2="-35" y2="60"/>
      <line x1="0" y1="60" x2="-28" y2="90"/>
      <line x1="0" y1="90" x2="-22" y2="115"/>
    </g>

    <!-- Barb lines right -->
    <g stroke="#c4b5fd" stroke-width="1.2" opacity="0.35">
      <line x1="0" y1="-120" x2="35" y2="-100"/>
      <line x1="0" y1="-90" x2="45" y2="-65"/>
      <line x1="0" y1="-60" x2="50" y2="-30"/>
      <line x1="0" y1="-30" x2="48" y2="5"/>
      <line x1="0" y1="0" x2="42" y2="35"/>
      <line x1="0" y1="30" x2="35" y2="60"/>
      <line x1="0" y1="60" x2="28" y2="90"/>
      <line x1="0" y1="90" x2="22" y2="115"/>
    </g>

    <!-- Nib (pen tip) -->
    <path d="M -8,140 L 0,180 L 8,140" fill="url(#inkGrad)"/>

    <!-- Ink drop -->
    <circle cx="0" cy="192" r="6" fill="url(#inkGrad)" opacity="0.8"/>
  </g>

  <!-- Subtle sparkle (AI accent) -->
  <g fill="#fbbf24" opacity="0.7">
    <polygon points="420,80 424,92 436,92 426,100 430,112 420,104 410,112 414,100 404,92 416,92" transform="scale(0.8)"/>
    <polygon points="140,60 143,68 151,68 145,73 147,81 140,76 133,81 135,73 129,68 137,68" transform="scale(0.6)"/>
  </g>
</svg>
