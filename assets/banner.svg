<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/></filter>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#grid)" rx="12"/>

  <!-- Ambient glow -->
  <circle cx="160" cy="150" r="160" fill="#6366f1" opacity="0.07" filter="url(#blur1)"/>
  <circle cx="1000" cy="150" r="180" fill="#8b5cf6" opacity="0.05" filter="url(#blur1)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Quill icon (left side) -->
  <g transform="translate(130, 150) rotate(-30) scale(0.65)" filter="url(#iconGlow)">
    <path d="M -20,140 C -10,80 -40,-20 -60,-100 C -50,-120 -30,-140 0,-160
             C 30,-140 50,-120 60,-100 C 40,-20 10,80 20,140 Z"
          fill="url(#quillGrad)" opacity="0.95"/>
    <line x1="0" y1="-155" x2="0" y2="140" stroke="#e2e8f0" stroke-width="2.5" opacity="0.5"/>
    <g stroke="#c4b5fd" stroke-width="1.2" opacity="0.3">
      <line x1="0" y1="-120" x2="-35" y2="-100"/><line x1="0" y1="-90" x2="-45" y2="-65"/>
      <line x1="0" y1="-60" x2="-50" y2="-30"/><line x1="0" y1="-30" x2="-48" y2="5"/>
      <line x1="0" y1="0" x2="-42" y2="35"/><line x1="0" y1="30" x2="-35" y2="60"/>
      <line x1="0" y1="-120" x2="35" y2="-100"/><line x1="0" y1="-90" x2="45" y2="-65"/>
      <line x1="0" y1="-60" x2="50" y2="-30"/><line x1="0" y1="-30" x2="48" y2="5"/>
      <line x1="0" y1="0" x2="42" y2="35"/><line x1="0" y1="30" x2="35" y2="60"/>
    </g>
    <path d="M -8,140 L 0,180 L 8,140" fill="url(#inkGrad)"/>
    <circle cx="0" cy="192" r="5" fill="url(#inkGrad)" opacity="0.8"/>
  </g>

  <!-- Suite app icons row -->
  <g transform="translate(60, 215)" opacity="0.85">
    <!-- Write -->
    <g><rect x="0" y="0" width="28" height="28" rx="6" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="0.8"/>
    <rect x="7" y="7" width="14" height="2" rx="1" fill="#60a5fa" opacity="0.7"/>
    <rect x="7" y="12" width="11" height="2" rx="1" fill="#60a5fa" opacity="0.5"/>
    <rect x="7" y="17" width="13" height="2" rx="1" fill="#60a5fa" opacity="0.4"/></g>
    <!-- Calc -->
    <g transform="translate(34,0)"><rect x="0" y="0" width="28" height="28" rx="6" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="0.8"/>
    <rect x="6" y="7" width="7" height="6" rx="1" fill="#4ade80" opacity="0.6"/>
    <rect x="15" y="7" width="7" height="6" rx="1" fill="#4ade80" opacity="0.4"/>
    <rect x="6" y="15" width="7" height="6" rx="1" fill="#4ade80" opacity="0.4"/>
    <rect x="15" y="15" width="7" height="6" rx="1" fill="#4ade80" opacity="0.6"/></g>
    <!-- Present -->
    <g transform="translate(68,0)"><rect x="0" y="0" width="28" height="28" rx="6" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="0.8"/>
    <rect x="5" y="6" width="18" height="11" rx="2" fill="#fbbf24" opacity="0.5"/>
    <rect x="8" y="20" width="12" height="2" rx="1" fill="#fbbf24" opacity="0.4"/></g>
    <!-- View -->
    <g transform="translate(102,0)"><rect x="0" y="0" width="28" height="28" rx="6" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="0.8"/>
    <text x="14" y="19" font-family="system-ui" font-size="12" font-weight="700" fill="#f87171" opacity="0.7" text-anchor="middle">P</text></g>
    <!-- Note -->
    <g transform="translate(136,0)"><rect x="0" y="0" width="28" height="28" rx="6" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="14" y="19" font-family="system-ui" font-size="11" font-weight="700" fill="#22d3ee" opacity="0.7" text-anchor="middle">M</text></g>
  </g>

  <!-- Title -->
  <text x="280" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#f1f5f9" letter-spacing="-2" filter="url(#shadow)">
    Quill
  </text>

  <!-- Subtitle -->
  <text x="280" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    AI-Powered Desktop Office Suite
  </text>

  <!-- App names -->
  <g transform="translate(280, 195)" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" letter-spacing="0.3">
    <text x="0" y="0">Write</text>
    <text x="4" y="0" fill="#475569">·</text>
    <text x="50" y="0">Calc</text>
    <text x="4" y="0" fill="#475569">·</text>
    <text x="90" y="0">Present</text>
    <text x="4" y="0" fill="#475569">·</text>
    <text x="150" y="0">View</text>
    <text x="4" y="0" fill="#475569">·</text>
    <text x="190" y="0">Note</text>
    <text x="4" y="0" fill="#475569">·</text>
    <text x="228" y="0">AI</text>
  </g>

  <!-- Tech badges -->
  <g transform="translate(280, 215)">
    <rect x="0" y="0" width="52" height="24" rx="12" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="26" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">Go</text>
    <rect x="62" y="0" width="64" height="24" rx="12" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="94" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Wails</text>
    <rect x="136" y="0" width="68" height="24" rx="12" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="170" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">React</text>
    <rect x="214" y="0" width="92" height="24" rx="12" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="260" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Right-side decorative quill strokes -->
  <g opacity="0.08" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round">
    <path d="M 850,40 Q 950,80 1100,50" fill="none"/>
    <path d="M 860,70 Q 970,110 1120,75" fill="none"/>
    <path d="M 840,100 Q 960,140 1140,100" fill="none"/>
    <path d="M 855,130 Q 980,170 1130,130" fill="none"/>
    <path d="M 845,160 Q 960,200 1110,165" fill="none"/>
    <path d="M 860,190 Q 970,230 1140,195" fill="none"/>
    <path d="M 840,220 Q 950,255 1120,225" fill="none"/>
    <path d="M 855,250 Q 975,280 1130,250" fill="none"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="297" width="1200" height="3" fill="url(#accent)" rx="1.5"/>
</svg>
