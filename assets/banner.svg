<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.3" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#grid)" rx="12"/>

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="150" r="180" fill="#3b82f6" opacity="0.06" filter="url(#blur1)"/>
  <circle cx="1000" cy="150" r="180" fill="#8b5cf6" opacity="0.06" filter="url(#blur1)"/>
  <circle cx="600" cy="250" r="120" fill="#06b6d4" opacity="0.04" filter="url(#blur1)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- App icon group -->
  <g transform="translate(100, 90)" filter="url(#iconShadow)">
    <!-- Outer rounded square -->
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Doc icon -->
    <g transform="translate(20, 14)">
      <rect x="0" y="0" width="36" height="44" rx="4" fill="#3b82f6" opacity="0.9"/>
      <rect x="6" y="8" width="24" height="2.5" rx="1" fill="#e2e8f0" opacity="0.8"/>
      <rect x="6" y="14" width="20" height="2.5" rx="1" fill="#e2e8f0" opacity="0.6"/>
      <rect x="6" y="20" width="16" height="2.5" rx="1" fill="#e2e8f0" opacity="0.4"/>
      <rect x="6" y="26" width="22" height="2.5" rx="1" fill="#e2e8f0" opacity="0.5"/>
      <rect x="6" y="32" width="14" height="2.5" rx="1" fill="#e2e8f0" opacity="0.3"/>
    </g>
    <!-- Grid/sheets icon -->
    <g transform="translate(64, 14)">
      <rect x="0" y="0" width="36" height="44" rx="4" fill="#22c55e" opacity="0.9"/>
      <rect x="6" y="8" width="10" height="8" rx="1.5" fill="#e2e8f0" opacity="0.7"/>
      <rect x="20" y="8" width="10" height="8" rx="1.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="6" y="20" width="10" height="8" rx="1.5" fill="#e2e8f0" opacity="0.5"/>
      <rect x="20" y="20" width="10" height="8" rx="1.5" fill="#e2e8f0" opacity="0.7"/>
      <rect x="6" y="32" width="10" height="8" rx="1.5" fill="#e2e8f0" opacity="0.4"/>
      <rect x="20" y="32" width="10" height="8" rx="1.5" fill="#e2e8f0" opacity="0.4"/>
    </g>
    <!-- Slides icon -->
    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="36" height="44" rx="4" fill="#f59e0b" opacity="0.9"/>
      <rect x="5" y="6" width="26" height="16" rx="2" fill="#e2e8f0" opacity="0.6"/>
      <rect x="8" y="26" width="20" height="2.5" rx="1" fill="#e2e8f0" opacity="0.4"/>
      <rect x="10" y="32" width="16" height="2.5" rx="1" fill="#e2e8f0" opacity="0.3"/>
    </g>
    <!-- AI sparkle icon -->
    <g transform="translate(64, 62)">
      <rect x="0" y="0" width="36" height="44" rx="4" fill="#8b5cf6" opacity="0.9"/>
      <g transform="translate(18, 22)" fill="#e2e8f0" opacity="0.8">
        <polygon points="0,-12 3,-4 12,-4 5,1 7,10 0,5 -7,10 -5,1 -12,-4 -3,-4"/>
      </g>
    </g>
  </g>

  <!-- Title text -->
  <text x="280" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="#f1f5f9" letter-spacing="-1" filter="url(#shadow)">
    Office AI
  </text>

  <!-- Subtitle -->
  <text x="280" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    AI-Powered Desktop Office Suite
  </text>

  <!-- Tech badges -->
  <g transform="translate(280, 200)">
    <rect x="0" y="0" width="52" height="24" rx="12" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="26" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Go</text>

    <rect x="62" y="0" width="64" height="24" rx="12" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="94" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Wails</text>

    <rect x="136" y="0" width="68" height="24" rx="12" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="170" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">React</text>

    <rect x="214" y="0" width="92" height="24" rx="12" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="260" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Right-side decorative lines -->
  <g opacity="0.12">
    <line x1="850" y1="60" x2="1150" y2="60" stroke="url(#accent)" stroke-width="1"/>
    <line x1="880" y1="80" x2="1150" y2="80" stroke="url(#accent)" stroke-width="1"/>
    <line x1="850" y1="100" x2="1100" y2="100" stroke="url(#accent)" stroke-width="1"/>
    <line x1="870" y1="120" x2="1150" y2="120" stroke="url(#accent)" stroke-width="1"/>
    <line x1="850" y1="140" x2="1120" y2="140" stroke="url(#accent)" stroke-width="1"/>
    <line x1="890" y1="160" x2="1150" y2="160" stroke="url(#accent)" stroke-width="1"/>
    <line x1="850" y1="180" x2="1080" y2="180" stroke="url(#accent)" stroke-width="1"/>
    <line x1="860" y1="200" x2="1150" y2="200" stroke="url(#accent)" stroke-width="1"/>
    <line x1="850" y1="220" x2="1130" y2="220" stroke="url(#accent)" stroke-width="1"/>
    <line x1="880" y1="240" x2="1150" y2="240" stroke="url(#accent)" stroke-width="1"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="297" width="1200" height="3" fill="url(#accent)" rx="1.5"/>
</svg>
